# Contratos e licitações federais: API de Dados Abertos do Compras.gov.br (sem token).
# Separado da atualização diária do Portal porque consulta centenas de órgãos (leva mais tempo).
name: Atualizar contratos e licitações

on:
  schedule:
    # 03:40 em Brasília (06:40 UTC), todos os dias. Ajuste a frequência aqui.
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Argumentos extras (ex.: --orgaos 36000,26246 ou --sem-licitacoes)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: dados-oficiais
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npx vitest run tests/contratos.test.ts
      - name: Baixar e processar
        env:
          ARGS: ${{ github.event.inputs.args }}
        run: |
          set -o pipefail
          npm run etl:contratos -- $ARGS 2>&1 | tee etl.log
      - name: Resumo do log
        if: always()
        run: |
          [ -f etl.log ] || exit 0
          RESUMO=$(grep -E "▶|✓|✗|unidades|órgãos|…|concluído|Erro|modalidade" etl.log | tail -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::notice title=CONTRATOS::$RESUMO"
      - name: Publicar dados
        run: |
          git config user.name "brasil-transparente-bot"
          git config user.email "brasil-transparente-bot@users.noreply.github.com"
          git add data/agregados
          if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
          git commit -m "Contratos e licitações atualizados em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 15; done
