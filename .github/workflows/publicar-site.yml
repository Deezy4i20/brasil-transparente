# Gera o site a partir dos dados oficiais processados e publica no GitHub Pages.
# Roda depois de cada "Atualizar dados oficiais", a cada mudança no site e sob demanda.
name: Publicar site

on:
  workflow_run:
    workflows: ["Atualizar dados oficiais"]
    types: [completed]
  push:
    branches: [main]
    paths: ["prototipo/modelo.template.html", "scripts/exportar-modelo.ts", "data/geo/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar o site com os dados oficiais
        run: npx tsx scripts/exportar-modelo.ts --oficial --site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
