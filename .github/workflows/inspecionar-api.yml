# Consulta URLs de APIs públicas (sem token) e publica as respostas no branch "inspecao-api".
name: Inspecionar API

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espaço"
        required: true

permissions:
  contents: write

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Consultar
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          mkdir -p out; n=0
          for U in $URLS; do
            n=$((n+1))
            code=$(curl -sSL -m 120 -A "Mozilla/5.0 brasil-transparente" -H "Accept: application/json" -o "out/r$n.body" -w "%{http_code} %{time_total}s %{size_download}B" "$U" || true)
            echo "$n $code $U" >> out/indice.txt
            head -c 600000 "out/r$n.body" > "out/r$n.txt" 2>/dev/null || echo "(sem corpo)" > "out/r$n.txt"; rm -f "out/r$n.body"
            sleep 3
          done
          cat out/indice.txt
      - name: Publicar
        run: |
          cd out && git init -q && git config user.name "brasil-transparente-bot" && git config user.email "brasil-transparente-bot@users.noreply.github.com"
          git add -A && git commit -qm "Inspeção de API"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/inspecao-api
