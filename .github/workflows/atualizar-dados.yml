# Atualiza os dados oficiais do Portal da Transparência e publica no repositório.
# A Vercel republica o site automaticamente a cada commit.
name: Atualizar dados oficiais

on:
  schedule:
    # 06:15 em Brasília (09:15 UTC), todos os dias. Ajuste a frequência aqui.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a processar (separados por espaço)"
        default: "ATUAL ANTERIOR"
        required: false
      conjuntos:
        description: "Conjuntos (orcamento,execucao,transferencias,emendas) — vazio = todos"
        default: ""
        required: false
      malhas:
        description: "Regerar as malhas do IBGE (true/false)"
        default: "false"
        required: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes (formato e cálculos)
        run: npm test

      - name: Malhas do IBGE
        if: ${{ github.event.inputs.malhas == 'true' }}
        run: npm run malhas

      - name: Baixar e processar os arquivos oficiais
        env:
          ANOS: ${{ github.event.inputs.anos || 'ATUAL ANTERIOR' }}
          CONJUNTOS: ${{ github.event.inputs.conjuntos }}
        run: |
          ATUAL=$(TZ=America/Sao_Paulo date +%Y)
          ANOS="${ANOS//ATUAL/$ATUAL}"
          ANOS="${ANOS//ANTERIOR/$((ATUAL-1))}"
          FALHOU=0
          for ANO in $ANOS; do
            echo "::group::Ano $ANO"
            set +e
            EXTRA=""; [ -n "$CONJUNTOS" ] && EXTRA="--conjuntos $CONJUNTOS"
            npm run etl -- --ano "$ANO" $EXTRA 2>&1 | tee -a etl.log
            ST=${PIPESTATUS[0]}
            set -e
            [ "$ST" = "0" ] || FALHOU=1
            echo "::endgroup::"
          done
          # Publica o final do log como anotação (legível pela API do GitHub)
          RESUMO=$(grep -E "▶|baixando|falhou|✓|✗|ignorado|lendo|Erro|Colunas|indisponível|aguardando|[0-9]{3} https" etl.log | tail -90 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          if [ "$FALHOU" = "1" ]; then echo "::error title=ETL::$RESUMO"; else echo "::notice title=ETL::$RESUMO"; fi
          echo "FALHOU=$FALHOU" >> "$GITHUB_ENV"

      - name: Resumo
        if: always()
        run: |
          node -e '
            let m; try { m = require("./data/agregados/manifesto.json"); } catch { console.log("Sem manifesto."); process.exit(0); }
            const linhas = m.conjuntos.map(c => `| ${c.ano} | ${c.conjunto} | ${c.mesesDisponiveis.join(",") || "anual"} | ${c.arquivos.reduce((s,a)=>s+a.linhasLidas,0)} | ${c.avisos.length} |`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "| Ano | Conjunto | Meses | Linhas lidas | Avisos |\n|---|---|---|---|---|\n" + linhas.join("\n") + "\n");
          '

      - name: Publicar dados atualizados
        run: |
          git config user.name "brasil-transparente-bot"
          git config user.email "brasil-transparente-bot@users.noreply.github.com"
          git add data/agregados data/geo
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Dados oficiais atualizados em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - name: Sinalizar falha parcial
        if: env.FALHOU == '1'
        run: |
          echo "Alguns conjuntos falharam; os que funcionaram foram publicados. Veja a anotação ETL."
          exit 1
