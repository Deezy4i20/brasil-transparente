# Atualiza os dados oficiais do Portal da Transparência e publica no repositório.
# A Vercel republica o site automaticamente a cada commit.
name: Atualizar dados oficiais

on:
  schedule:
    # 06:15 em Brasília (09:15 UTC), todos os dias. Ajuste a frequência aqui.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a processar (separados por espaço)"
        default: "ATUAL ANTERIOR"
        required: false
      malhas:
        description: "Regerar as malhas do IBGE (true/false)"
        default: "false"
        required: false

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes (formato e cálculos)
        run: npm test

      - name: Malhas do IBGE
        if: ${{ github.event.inputs.malhas == 'true' }}
        run: npm run malhas

      - name: Baixar e processar os arquivos oficiais
        env:
          ANOS: ${{ github.event.inputs.anos || 'ATUAL ANTERIOR' }}
        run: |
          ATUAL=$(TZ=America/Sao_Paulo date +%Y)
          ANOS="${ANOS//ATUAL/$ATUAL}"
          ANOS="${ANOS//ANTERIOR/$((ATUAL-1))}"
          for ANO in $ANOS; do
            echo "::group::Ano $ANO"
            npm run etl -- --ano "$ANO"
            echo "::endgroup::"
          done

      - name: Resumo
        run: |
          node -e '
            const m = require("./data/agregados/manifesto.json");
            const linhas = m.conjuntos.map(c => `| ${c.ano} | ${c.conjunto} | ${c.mesesDisponiveis.join(",") || "anual"} | ${c.arquivos.reduce((s,a)=>s+a.linhasLidas,0)} | ${c.avisos.length} |`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "| Ano | Conjunto | Meses | Linhas lidas | Avisos |\n|---|---|---|---|---|\n" + linhas.join("\n") + "\n");
          '

      - name: Publicar dados atualizados
        run: |
          git config user.name "brasil-transparente-bot"
          git config user.email "brasil-transparente-bot@users.noreply.github.com"
          git add data/agregados data/geo
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Dados oficiais atualizados em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi
